[package]
name = "bilbli-copy"
version = "0.4.1"
description = "Download videos from Bilibili"
authors = ["you"]
edition = "2021"

[lib]
name = "bilbli_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
reqwest = { version = "0.12", features = ["cookies", "json", "native-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
md-5 = "0.10"
serde_urlencoded = "0.7"
futures-util = "0.3"
futures = "0.3"
once_cell = "1"
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
