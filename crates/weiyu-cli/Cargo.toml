[package]
name = "weiyu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless Bilibili query CLI and HTTP/stdio MCP server"

[dependencies]
weiyu-core = { path = "../weiyu-core", default-features = false, features = ["rustls"] }
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
