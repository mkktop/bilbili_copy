name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-install WiX tools
        shell: pwsh
        run: |
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools314"
          if (-not (Test-Path $wixDir)) {
            New-Item -ItemType Directory -Path $wixDir -Force | Out-Null
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:TEMP\wix314.zip"
            Expand-Archive -Path "$env:TEMP\wix314.zip" -DestinationPath $wixDir
          }
          Get-ChildItem "$wixDir\*.exe" | Unblock-File

      - name: Prepare signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $trimmed = $env:RAW_KEY.Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$trimmed" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Read release notes
        id: release_notes
        shell: bash
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            {
              echo "NOTES<<EOF"
              cat RELEASE_NOTES.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "NOTES=版本 ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "未雨 for Windows ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.NOTES }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri

  assemble-latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          filename: "*"
          out-file-path: "assets"

      - name: Generate latest.json
        env:
          # R2 公开域名（可在仓库 Variables 里覆盖，如需换绑定域名时不用改代码）
          R2_BASE: ${{ vars.R2_PUBLIC_BASE || 'https://weiyu.yeyushi.com' }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ github.ref_name }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MSI_SIG=""
          MSI_URL=""
          MSI_BASENAME=""

          cd assets

          for f in *.sig; do
            SIG=$(cat "$f")
            BASENAME="${f%.sig}"

            if [[ "$BASENAME" == *.msi ]]; then
              MSI_SIG="$SIG"
              MSI_URL="https://github.com/mkktop/bilbili_copy/releases/download/${TAG}/${BASENAME}"
              MSI_BASENAME="$BASENAME"
            fi
          done

          # 从 GitHub Release API 获取 release body 作为更新日志
          RELEASE_BODY=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" | jq -r '.body // ""')
          # 转义 JSON 特殊字符
          RELEASE_BODY_ESCAPED=$(echo "$RELEASE_BODY" | jq -Rs '.')

          cd ..

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": ${RELEASE_BODY_ESCAPED},
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${MSI_SIG}",
                "url": "${MSI_URL}"
              }
            }
          }
          EOF

          # R2 渠道版 latest.json：安装包 URL 指向 R2 公开域名，签名与 GitHub 版一致
          cat > latest-r2.json << EOF
          {
            "version": "${VERSION}",
            "notes": ${RELEASE_BODY_ESCAPED},
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${MSI_SIG}",
                "url": "${R2_BASE}/releases/v${VERSION}/${MSI_BASENAME}"
              }
            }
          }
          EOF

          cat latest.json latest-r2.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUCKET="copy"
          MSI_FILE=$(ls assets/*.msi | head -1)

          npx --yes wrangler@latest r2 object put "${BUCKET}/releases/v${VERSION}/$(basename "$MSI_FILE")" \
            --file "$MSI_FILE" --remote --content-type application/octet-stream
          npx --yes wrangler@latest r2 object put "${BUCKET}/releases/v${VERSION}/$(basename "$MSI_FILE").sig" \
            --file "${MSI_FILE}.sig" --remote --content-type text/plain
          npx --yes wrangler@latest r2 object put "${BUCKET}/latest.json" \
            --file latest-r2.json --remote --content-type application/json

      - name: Prune old versions from R2 (keep current only)
        # 清理 R2 上的历史版本安装包，只保留当前版（回滚走 GitHub Release，全量保留）。
        # 文件名从各 release 的资产列表取——历史版本可能还是旧产品名（BilbliCopy_*），不能按当前名拼。
        # 失败不阻塞发版（对象残留可下次发版时再清）。
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CURRENT="${{ github.ref_name }}"
          PAGE=1
          while : ; do
            RESP=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$PAGE")
            COUNT=$(echo "$RESP" | jq 'length')
            for TAG in $(echo "$RESP" | jq -r '.[].tag_name'); do
              [ "$TAG" = "$CURRENT" ] && continue
              echo "清理旧版本: $TAG"
              for f in $(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.assets[].name' | grep -E '\.(msi|sig)$'); do
                echo "  delete releases/$TAG/$f"
                npx --yes wrangler@latest r2 object delete "copy/releases/$TAG/$f" --remote || true
              done
            done
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
